name: Temporary Vitest plugin lockfile

on:
  push:
    branches: [chore/migrate-cloudflare-vitest-plugin]

permissions:
  contents: write

defaults:
  run:
    working-directory: backend

jobs:
  generate:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install
        run: npm ci

      - name: Check generated types
        run: npx wrangler types

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Commit lockfile and remove temporary workflow
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git rm .github/workflows/temp-vitest-plugin-lock.yml
          git commit -m "chore(backend): regenerate package lock"
          git push
