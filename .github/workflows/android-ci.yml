name: Android CI

on:
  push:
    branches: [ main ]
    # Backend-, docs- and iOS-only changes can't affect the Android build, so skip them.
    paths-ignore: [ 'backend/**', 'iosApp/**', '**/*.md', 'docs/**', 'LICENSE', '.github/workflows/backend-ci.yml', '.github/workflows/shared-ios-ci.yml' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ 'backend/**', 'iosApp/**', '**/*.md', 'docs/**', 'LICENSE', '.github/workflows/backend-ci.yml', '.github/workflows/shared-ios-ci.yml' ]
  workflow_dispatch:

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test (debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'

      # setup-gradle (v4+) validates the gradle-wrapper.jar checksum automatically
      # on every run and handles Gradle dependency/build caching.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Lint, build and unit test
        run: ./gradlew --no-daemon --stacktrace lintDebug assembleDebug testDebugUnitTest :shared:testAndroidHostTest

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
